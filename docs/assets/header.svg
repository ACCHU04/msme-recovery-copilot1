<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Behind Brand -->
  <ellipse cx="600" cy="160" rx="450" ry="180" fill="url(#glow)" />

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 52)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-165" cy="0" r="4.5" fill="#10b981" />
    <text x="-150" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
      SRUJANA TECH FEST 2026 · PROBLEM LS-03
    </text>
  </g>

  <!-- Main Brand Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#brandGrad)" letter-spacing="-1.5">
    Settle45
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#f8fafc" letter-spacing="-0.3">
    MSME Statutory Payment Recovery Copilot
  </text>

  <!-- Description Line -->
  <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
    Helping micro and small businesses calculate statutory dues under MSMED Act, 2006 &amp; recover them calmly.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(190, 280)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#60a5fa">
      45-Day Statutory Clock
    </text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="195" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text x="292.5" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#c084fc">
      3x RBI Compound Interest
    </text>

    <!-- Pill 3 -->
    <rect x="405" y="0" width="200" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="505" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#34d399">
      WhatsApp &amp; Email Notices
    </text>

    <!-- Pill 4 -->
    <rect x="620" y="0" width="200" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
    <text x="720" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#fbbf24">
      Deterministic Legal Engine
    </text>
  </g>
</svg>
